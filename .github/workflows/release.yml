name: Release

# Builds the Windows installer (NSIS) and the portable exe and attaches both to a GitHub release.
# Trigger: push a tag like v0.2.0, or run manually with a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.2.0). Creates tag v<version> on the selected commit."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Bad version: $v" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # package.json version follows the tag, so file names and the About dialog match the release
      - name: Set app version
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm test

      - name: Build installer and portable exe
        run: npx vite build && npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          files=(release/*.exe release/SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            pre=(); [[ "$tag" == *-* ]] && pre=(--prerelease)  # v1.2.0-rc.1 must not become "Latest"
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "YM Classic $tag" --generate-notes "${pre[@]}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ym-classic-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
